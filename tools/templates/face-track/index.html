<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Face-Track Fullscreen Composition</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --bg-dark: #0b0d12;
        --text-white: #ffffff;
        --hl-yellow: #ffd60a;
        --hl-green: #22c55e;
        --hl-red: #ef4444;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg-dark);
        font-family: "Montserrat", sans-serif;
        color: var(--text-white);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg-dark);
      }
      /* Full-screen landmark-tracked speaker wrapper */
      #face-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 720px;
        height: 1280px;
        transform-origin: 0 0;
        z-index: 1;
        will-change: transform;
      }
      #face-video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        filter: contrast(1.04) saturate(1.05);
      }
      /* Chin-safe lower-third captions (positioned below chin_y, default y=1380) */
      #captions-stage {
        position: absolute;
        left: 0;
        right: 0;
        top: 1380px;
        z-index: 10;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .cap-chunk {
        position: absolute;
        left: 48px;
        right: 48px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        will-change: transform, opacity, filter;
      }
      .cap-word {
        display: inline-block;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 62px;
        line-height: 1.08;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--text-white);
        -webkit-text-stroke: 3.5px #07090e;
        paint-order: stroke fill;
        text-shadow: -3px -3px 0 #07090e, 3px -3px 0 #07090e, -3px 3px 0 #07090e, 3px 3px 0 #07090e, 0 8px 22px rgba(0,0,0,0.75);
        transform-origin: center center;
        will-change: transform, filter, color;
      }
      .cap-word.hl-yellow { color: var(--hl-yellow); }
      .cap-word.hl-green { color: var(--hl-green); }
      .cap-word.hl-red { color: var(--hl-red); }
      /* Optional Debug Crosshair HUD (--debug mode) */
      #debug-hud {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        display: none;
      }
      #debug-banner {
        position: absolute;
        top: 48px;
        left: 48px;
        right: 48px;
        padding: 18px 28px;
        border-radius: 16px;
        background: rgba(11, 13, 18, 0.88);
        border: 2px solid rgba(255, 214, 10, 0.55);
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        font-weight: 700;
        color: var(--hl-yellow);
      }
      #debug-crosshair {
        position: absolute;
        top: 720px;
        left: 540px;
        width: 56px;
        height: 56px;
        margin-left: -28px;
        margin-top: -28px;
        border: 3px solid var(--hl-yellow);
        border-radius: 50%;
        box-shadow: 0 0 18px rgba(239, 68, 68, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.0" data-width="1080" data-height="1920">
      <div id="face-wrapper">
        <video id="face-video" data-start="0" data-duration="6.0" data-track-index="0" src="assets/cut.mp4" muted playsinline></video>
      </div>
      <audio id="face-audio" data-start="0" data-duration="6.0" data-track-index="1" data-volume="1" src="assets/cut.mp4"></audio>

      <div id="captions-stage"></div>

      <div id="debug-hud">
        <div id="debug-banner">ANCHOR: GLABELLA (EYEBROWS) | MODE: SMOOTH | STATE: TRACKING</div>
        <div id="debug-crosshair"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const COMP_DURATION = 6.0;

      // Keyframes generated by `node tools/face-landmark-tracker.mjs`
      const TRACK_KEYFRAMES = [
        { time: 0.0, wrapper: { x: -242, y: -435, scale: 2.025 } },
        { time: 2.0, wrapper: { x: -250, y: -440, scale: 2.025 } },
        { time: 4.0, wrapper: { x: -236, y: -430, scale: 2.025 } },
        { time: 6.0, wrapper: { x: -242, y: -435, scale: 2.025 } },
      ];

      if (TRACK_KEYFRAMES.length > 0) {
        tl.set("#face-wrapper", TRACK_KEYFRAMES[0].wrapper, 0);
        for (let i = 1; i < TRACK_KEYFRAMES.length; i++) {
          const prev = TRACK_KEYFRAMES[i - 1];
          const curr = TRACK_KEYFRAMES[i];
          const dur = Math.max(0.03, curr.time - prev.time);
          tl.to("#face-wrapper", { ...curr.wrapper, duration: dur, ease: "none" }, prev.time);
        }
      }

      // Optional chin-safe lower-third captions (leave empty for --clean mode)
      const CAPTION_CHUNKS = [
        { words: [{ text: "LOCKED", start: 0.1, end: 0.6, highlight: "yellow" }, { text: "ON", start: 0.6, end: 1.0, highlight: null }, { text: "EYEBROWS", start: 1.0, end: 1.8, highlight: "green" }] },
      ];

      const capStage = document.getElementById("captions-stage");
      CAPTION_CHUNKS.forEach((chunk, cIdx) => {
        const chunkEl = document.createElement("div");
        chunkEl.className = "cap-chunk";
        chunkEl.id = `cap-chunk-${cIdx}`;
        chunk.words.forEach((w, wIdx) => {
          const span = document.createElement("span");
          span.className = "cap-word" + (w.highlight ? ` hl-${w.highlight}` : "");
          span.id = `cap-w-${cIdx}-${wIdx}`;
          span.textContent = w.text.toUpperCase();
          chunkEl.appendChild(span);
        });
        capStage.appendChild(chunkEl);

        const cStart = Math.max(0, chunk.words[0].start - 0.06);
        const cEnd = chunk.words[chunk.words.length - 1].end + 0.08;
        tl.set(chunkEl, { visibility: "visible" }, cStart);
        tl.fromTo(chunkEl, { opacity: 0, y: 12, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, cStart);

        chunk.words.forEach((w, wIdx) => {
          const wEl = `#cap-w-${cIdx}-${wIdx}`;
          tl.fromTo(wEl, { scale: 0.92 }, { scale: 1.18, duration: 0.09, ease: "back.out(3)" }, w.start);
          tl.to(wEl, { scale: 1.0, duration: 0.12, ease: "power2.out" }, w.end);
        });

        tl.to(chunkEl, { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power2.in" }, cEnd);
        tl.set(chunkEl, { visibility: "hidden" }, cEnd + 0.11);
      });

      tl.set({}, {}, COMP_DURATION);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
